<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="590" viewBox="0 0 1620 590" role="img" aria-label="Packer builds Flask_Packer_Image from Canonical's Ubuntu 24.04 image with the Flask service, gunicorn and stress. flask-vmss, a scale set of two to four Standard_B1s instances across zones 1 and 2, runs that image. Clients reach the service through flask-app-gateway on port 80, which forwards to port 8000 and probes /gtg. Autoscale rules on Percentage CPU add or remove an instance, the service reads and writes a serverless Cosmos DB container with its managed identity, and Azure Bastion gives SSH to the instances."><defs><marker id="a_e_build" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475467"/></marker><marker id="a_e_ami" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475467"/></marker><marker id="a_e_bas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475467"/></marker><marker id="a_e_http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_tg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_scale" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="a_e_ddb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker></defs><rect width="1620" height="590" fill="#ffffff"/><path d="M250.0,150 V235" fill="none" stroke="#475467" stroke-width="2" marker-end="